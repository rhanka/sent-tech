name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sent_tech
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Lint workspace
        run: make lint
      - name: Run unit tests (API)
        run: make test-api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sent_tech
      - name: Run unit tests (UI)
        run: make test-ui
      - name: Install Playwright browsers
        run: pnpm --filter sent-tech-e2e exec playwright install --with-deps chromium
      - name: Run e2e tests
        run: make test-e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:4173
